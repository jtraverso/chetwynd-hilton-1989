name = "ch1989"
version = "0.1.0"
defaultTargets = ["CH89", "CH89Challenge", "CH89Solution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "plantholt_overfull"
git = "https://github.com/jtraverso/plantholt-overfull-criterion"
rev = "f8900944da7743b1facd771139c9ebdbfd8aaa28"

[[lean_lib]]
name = "CH89"
globs = ["CH89.+"]

[[lean_lib]]
name = "CH89Challenge"
roots = ["CH89Challenge"]

[[lean_lib]]
name = "CH89Solution"
roots = ["CH89Solution"]
