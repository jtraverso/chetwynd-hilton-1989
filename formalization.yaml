repository:
  role: "substantive-development"

sources:
  - title: "1-factorizing regular graphs of high degree — an improved bound"
    authors:
      - "A. G. Chetwynd"
      - "A. J. W. Hilton"
    id: "doi:10.1016/0012-365X(89)90082-4"
    type: "paper"
    location: "Discrete Mathematics 75 (1989), 103–112: Theorems 1 and 2, Lemma 3"
    relationship: "formalizes"
    note: >-
      Theorem 2 is formalized as stated. The step of §4 "we may moreover suppose that x_j comes
      before w_j" is not justified in the article and is replaced by a proof (choice of M₀,
      ordering, Hall pairing); see NOTES.md. The formalization is by a different author; the
      article's authors were not involved.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "PALOMAR-2026-11-04-000016 v2 (jtraverso/plantholt-overfull-criterion @ f890094)"
    relationship: "builds-on"
    note: >-
      Pinned dependency: staircase labellings (OneFactor.StairData), the core lemma of Theorem 5
      (OneFactor.core_colorable), near 1-factors through prescribed matchings
      (OneFactor.exists_factors_var), re-insertion of w (OneFactor.colorable_of_regular_keepAt),
      and Plantholt.RegularOneFactorable / Plantholt.theorem_1_2 for the corollaries. That entry
      proves the 6/7 bound of Chetwynd–Hilton 1985 with extra factors per bad pair; this entry
      proves the 1989 bound.
  - id: "PALOMAR-2026-11-04-000009 v2 (jtraverso/overfull-critical-graphs @ b85da9a)"
    relationship: "builds-on"
    note: "Transitive dependency: Vizing's adjacency lemma (pivot lemma)."
  - id: "PALOMAR-2026-10-15-000004 (jtraverso/vizing @ 33b2de8)"
    relationship: "builds-on"
    note: "Transitive dependency: Vizing's theorem."

status:
  scope: >-
    Theorem 2 (and Theorem 1 in the form used for it, CH89.colorable_of_labelling). Also in the
    library, not compared: Plantholt.RegularOneFactorable ((√7 − 1)/2) and Plantholt's overfull
    criterion with c* = (√7 − 1)/2. Not formalized: Theorem 3 of the article as a separate
    statement.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Found the repair of the ordering step, checked the parameter inequalities numerically,
        wrote the Lean development, the Challenge/Solution pair and the packaging under the
        author's direction, checked with lean against the pinned dependencies, #print axioms and
        a comparison of the elaborated Challenge and Solution statements (pp.all)
        (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean development is AI-written under the
    author's direction and mechanically verified: no sorry, axioms limited to propext,
    Classical.choice and Quot.sound, identical elaborated statements in the Challenge and the
    Solution.

fidelity:
  divergences: >-
    1-factorizable is stated as d-colourability of the line graph (equivalent for d-regular
    graphs). The real threshold is (√7 − 1)/2 · |V| ≤ d with Real.sqrt; the integer form uses
    |V| = 2n and 7n² ≤ (d + n)².

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the statement was
    checked against the article and on small cases (|V| = 0; K₆ with d = 5 is the smallest
    instance and is handled by the complete-graph case). No independent human review. The
    repair of the ordering step is new as far as the agent knows; it is mechanically checked.

alignment:
  namespace: "CH89"
  statements:
